name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: just verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run the canonical verification gate
        run: just verify

      - name: Upload the verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-verification
          path: artifacts/v1-verification.md
