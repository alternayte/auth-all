services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authall
      POSTGRES_PASSWORD: authall
      POSTGRES_DB: authall
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authall -d authall"]
      interval: 1s
      timeout: 5s
      retries: 60
    tmpfs:
      - /var/lib/postgresql/data
