# GoReleaser builds and publishes the auth-all command line tool.
#
# The library itself needs no release step. A Go consumer resolves it from the
# git tag. This configuration only ships the operator tool.
version: 2

project_name: auth-all

before:
  hooks:
    - go mod tidy

builds:
  - id: auth-all
    main: ./cmd/auth-all
    binary: auth-all
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: auth-all
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    Go library:

    ```bash
    go get github.com/alternayte/auth-all@{{ .Tag }}
    ```

    TypeScript client:

    ```bash
    npm install @auth-all/client@{{ .Version }}
    ```
